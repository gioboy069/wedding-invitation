<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download — Wedding Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css?v=footer-pad" />
  <script src="/js/shared.js?v=no-stones" defer></script>
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Montserrat,sans-serif; background:#f7f5f1; color:#0d2b45; padding:2rem; text-align:center; position:relative; z-index:1; }
    .card { max-width:420px; width:100%; background:#fff; border:1px solid rgba(95,168,184,.25); padding:2.5rem 2rem; position:relative; z-index:1; }
    h1 { font-family:"Cormorant Garamond",serif; font-size:2rem; margin-bottom:.75rem; }
    p { color:#3d5a6c; margin-bottom:1.25rem; line-height:1.6; }
    a.btn { display:block; width:100%; box-sizing:border-box; border:0; cursor:pointer; padding:1rem; background:#0d2b45; color:#f7f5f1; font:500 .75rem Montserrat,sans-serif; letter-spacing:.2em; text-transform:uppercase; text-decoration:none; }
    a.btn:hover { background:#6ba7a0; }
    .meta { margin-top:1rem; font-size:.75rem; color:#6ba7a0; }
    a.link { display:inline-block; margin-top:1.25rem; font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:#1b4965; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Download Project</h1>
    <p>Latest wedding invitation for Render — floral frame, centered nav, RSVP CTA, gallery, and admin dashboard.</p>
    <a class="btn" href="/download.zip">Download ZIP</a>
    <p class="meta" id="meta"></p>
    <a class="link" href="/">Back to invitation</a>
  </div>
  <script>
    fetch("/download.zip", { method: "HEAD" }).then((r) => {
      const len = r.headers.get("content-length");
      if (len) document.getElementById("meta").textContent = Math.round(Number(len) / 1024) + " KB";
    }).catch(() => {});
  </script>
</body>
</html>
