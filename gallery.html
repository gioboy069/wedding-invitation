<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prenup photo gallery — Augiela Shane & Gio Anthony" />
  <title>Gallery — Gio Anthony & Augiela Shane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <script src="/js/shared.js" defer></script>
  <style>
    :root {
      --bg: #f8f4ec;
      --sage: #7a8b6f;
      --sage-light: #c5d4ba;
      --sea: #1b4965;
      --sea-deep: #0f2e3d;
      --sea-soft: #b8d4de;
      --text: #1a3340;
      --text-soft: #3d5a6c;
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Montserrat", system-ui, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      font-weight: 300;
      color: var(--text);
      background: var(--sea-deep);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .nav {
      position: fixed;
      top: clamp(4.25rem, 7.5vw, 5.5rem);
      left: 0;
      right: 0;
      z-index: 200;
      padding: 0.85rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      width: max-content;
      max-width: calc(100vw - clamp(3.25rem, 12vw, 6.5rem));
      margin-left: auto;
      margin-right: auto;
      background: rgba(15, 46, 61, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(184, 212, 222, 0.28);
      border-radius: 999px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      transition: box-shadow 0.35s ease, padding 0.35s ease;
    }

    .nav.scrolled {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
      padding: 0.75rem 1.5rem;
      border-color: rgba(184, 212, 222, 0.4);
    }

    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--bg);
    }

    .nav-logo span { color: var(--sage-light); }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(242, 245, 239, 0.7);
      transition: color 0.3s;
    }

    .nav-links a:hover { color: var(--bg); }

    .page-hero {
      padding: 10.5rem 1.5rem 3rem;
      text-align: center;
      color: var(--bg);
    }

    .page-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--sage-light);
      margin-bottom: 1rem;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 400;
      margin-bottom: 0.75rem;
    }

    .page-subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: rgba(242, 245, 239, 0.72);
      max-width: 540px;
      margin: 0 auto;
    }

    .gallery-page {
      padding: 1rem 1.5rem 5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-masonry {
      columns: 3;
      column-gap: 1rem;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      position: relative;
      border: none;
      padding: 0;
      cursor: pointer;
      background: rgba(27, 73, 101, 0.4);
      width: 100%;
      display: block;
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.7s var(--ease-out);
    }

    .gallery-item:hover img { transform: scale(1.04); }

    .gallery-item:focus-visible {
      outline: 2px solid var(--sage-light);
      outline-offset: 3px;
    }

    .gallery-caption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 2rem 1rem 1rem;
      background: linear-gradient(to top, rgba(15, 46, 61, 0.85), transparent);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--bg);
      text-align: left;
      opacity: 0;
      transition: opacity 0.35s;
    }

    .gallery-item:hover .gallery-caption { opacity: 1; }

    .gallery-empty, .gallery-loading {
      text-align: center;
      color: rgba(242, 245, 239, 0.7);
      padding: 4rem 1rem;
      font-family: var(--font-serif);
      font-style: italic;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15, 46, 61, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
    }

    .lightbox.open { opacity: 1; visibility: visible; }

    .lightbox img {
      max-width: min(1000px, 100%);
      max-height: 85vh;
      object-fit: contain;
    }

    .lightbox-close, .lightbox-prev, .lightbox-next {
      position: absolute;
      background: none;
      border: 1px solid rgba(242, 245, 239, 0.3);
      color: var(--bg);
      width: 44px;
      height: 44px;
      cursor: pointer;
      font-size: 1.25rem;
    }

    .lightbox-close { top: 1.5rem; right: 1.5rem; }
    .lightbox-prev { left: 1.5rem; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 1.5rem; top: 50%; transform: translateY(-50%); }

    .lightbox-caption {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-serif);
      font-style: italic;
      color: rgba(242, 245, 239, 0.85);
      text-align: center;
    }

    .footer {
      text-align: center;
      border-top: 1px solid rgba(95, 168, 184, 0.15);
    }

    .footer .footer-secondary {
      display: block;
      margin-top: 1.15rem;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(242, 245, 239, 0.7);
    }

    .footer .footer-secondary:hover {
      color: var(--bg);
    }

    @media (max-width: 900px) {
      .gallery-masonry { columns: 2; }
      .nav-links { gap: 1rem; }
      .lightbox-prev, .lightbox-next { display: none; }
    }

    @media (max-width: 560px) {
      .gallery-masonry { columns: 1; }
      .nav-links a:not(.keep) { display: none; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">G <span>&</span> A</a>
    <ul class="nav-links">
      <li><a href="index.html">Invitation</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="index.html#rsvp">RSVP</a></li>
    </ul>
  </nav>

  <header class="page-hero">
    <p class="page-label">Our Moments</p>
    <h1 class="page-title">Prenup Gallery</h1>
    <p class="page-subtitle">Every frame a chapter — vineyards, coastlines, and the quiet hours that led us here.</p>
  </header>

  <div class="gallery-page">
    <p class="gallery-loading" id="galleryLoading">Loading photos…</p>
    <div class="gallery-masonry" id="galleryGrid" hidden></div>
    <p class="gallery-empty hidden" id="galleryEmpty">Photos coming soon.</p>
  </div>

  <footer class="footer footer-cta">
    <p class="footer-cta__label">Ready to join us in Napa Valley?</p>
    <a class="rsvp-cta" href="index.html#rsvp">RSVP Now</a>
    <a class="footer-secondary" href="index.html">Back to Invitation</a>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="Previous">&#8592;</button>
    <img id="lightboxImg" src="" alt="" />
    <button class="lightbox-next" id="lightboxNext" aria-label="Next">&#8594;</button>
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <script>
    (function () {
      const grid = document.getElementById("galleryGrid");
      const loading = document.getElementById("galleryLoading");
      const empty = document.getElementById("galleryEmpty");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxCaption = document.getElementById("lightboxCaption");
      let photos = [];
      let current = 0;

      function openLightbox(i) {
        current = i;
        const p = photos[i];
        lightboxImg.src = p.src;
        lightboxImg.alt = p.alt || p.caption || "";
        lightboxCaption.textContent = p.caption || "";
        lightbox.hidden = false;
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightbox.hidden = true;
        document.body.style.overflow = "";
      }

      function showSlide(dir) {
        current = (current + dir + photos.length) % photos.length;
        openLightbox(current);
      }

      fetch("/api/gallery")
        .then((r) => r.json())
        .then((data) => {
          photos = Array.isArray(data) ? data : [];
          loading.hidden = true;
          if (!photos.length) {
            empty.classList.remove("hidden");
            return;
          }
          grid.hidden = false;
          grid.innerHTML = photos.map((p, i) => `
            <button class="gallery-item" type="button" data-index="${i}" aria-label="${escapeAttr(p.caption || "View photo")}">
              <img src="${escapeAttr(p.src)}" alt="${escapeAttr(p.alt || p.caption || "")}" loading="lazy" />
              <span class="gallery-caption">${escapeHtml(p.caption || "")}</span>
            </button>
          `).join("");
        })
        .catch(() => {
          loading.textContent = "Unable to load gallery.";
        });

      grid.addEventListener("click", (e) => {
        const btn = e.target.closest(".gallery-item");
        if (btn) openLightbox(Number(btn.dataset.index));
      });

      document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
      document.getElementById("lightboxPrev").addEventListener("click", () => showSlide(-1));
      document.getElementById("lightboxNext").addEventListener("click", () => showSlide(1));
      lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") showSlide(-1);
        if (e.key === "ArrowRight") showSlide(1);
      });

      function escapeHtml(s) {
        return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }
      function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "&#39;"); }
    })();
  </script>
</body>
</html>
