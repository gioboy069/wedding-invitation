<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan to share — Gio &amp; Augiela</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Source+Sans+3:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --deep: #0d2b45;
      --teal: #1e5a6e;
      --paper: #f7f5f1;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Source Sans 3", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e7eef1;
      font-family: var(--sans);
      color: var(--deep);
      padding: 1.5rem;
    }
    .card {
      width: min(26rem, 100%);
      background: var(--paper);
      border: 1px solid rgba(13, 43, 69, 0.12);
      border-radius: 1.4rem;
      padding: 2rem 1.5rem 1.6rem;
      text-align: center;
      box-shadow: 0 18px 40px rgba(13, 43, 69, 0.08);
    }
    .kicker {
      margin: 0;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.68rem;
      color: var(--teal);
    }
    h1 {
      margin: 0.35rem 0 0.15rem;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 2.8rem;
      line-height: 0.95;
    }
    .date {
      margin: 0 0 1rem;
      font-family: var(--serif);
      font-style: italic;
      color: var(--teal);
      font-size: 1.15rem;
    }
    img {
      width: min(16rem, 78vw);
      height: auto;
      background: var(--paper);
    }
    h2 {
      margin: 0.8rem 0 0.25rem;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.8rem;
    }
    p { margin: 0; color: var(--teal); line-height: 1.45; }
    .url {
      margin-top: 0.8rem;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      word-break: break-all;
    }
    .print {
      margin-top: 1.1rem;
      min-height: 44px;
      padding: 0.55rem 1.2rem;
      border: 0;
      border-radius: 999px;
      background: var(--deep);
      color: var(--paper);
      font: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    @media print {
      body { background: white; padding: 0; }
      .print { display: none; }
      .card { box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>
  <article class="card">
    <p class="kicker">Gio &amp; Augiela</p>
    <h1>Share a moment</h1>
    <p class="date">February 18, 2027</p>
    <img src="/share/qr.svg" alt="QR code that opens the guest upload page" />
    <h2>Scan to share</h2>
    <p>A photo or video from the day.</p>
    <p class="url" id="shareUrl"></p>
    <button class="print" type="button" onclick="window.print()">Print this card</button>
  </article>
  <script>
    fetch("/share/qr.svg").then(function (response) {
      var target = response.headers.get("x-share-url");
      if (target) document.getElementById("shareUrl").textContent = target;
    }).catch(function () {});
  </script>
</body>
</html>
